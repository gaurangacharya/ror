version: '3.7'
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile.development
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
        DYNO: web.1
    volumes:
      - .:/opt/app
      - bundle:/opt/bundle
    links:
      - mysql
      - worker
      - mailcatcher
      - memcached
      - redis
    ports:
      - '3000:3000'
    env_file:
      - .env
  worker:
    build:
      context: .
      dockerfile: ./Dockerfile.development
      args:
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
        DYNO: worker.1
    volumes:
      - .:/opt/app
      - bundle:/opt/bundle
    links:
      - mysql
      - mailcatcher
      - redis
    env_file: .env
    environment:
      - MAGICK_MAP_LIMIT=64MiB
      - MAGICK_MEMORY_LIMIT=256MiB
      - MAGICK_TIME_LIMIT=30
    #command: bundle exec rake ts:regenerate && bundle exec sidekiq -q default -q paperclip -q mailers
    command: script/start-worker.sh
  mysql:
    image: mysql:5.7.37
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_USER: rdeveloper
      MYSQL_PASSWORD: rdeveloper
      MYSQL_DATABASE: ownoutdoors_development
    volumes:
      - mysql:/var/lib/mysql
    command: ['mysqld', '--character-set-server=utf8', '--collation-server=utf8_unicode_ci']
  memcached:
    image: memcached:latest
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - '1080:1080'
  redis:
    image: redis:6.0.16-alpine
    restart: always
    volumes:
      - redis:/root/redis
    environment:
      - REDIS_PORT=6379
      - REDIS_DATABASES=4

volumes:
  mysql:
  bundle:
  redis:

